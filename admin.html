<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Key Panel</title>
</head>
<body>
    <div class="nav-links">
        <a href="admin.html">Admin Panel</a> | 
        <a href="key.html">Key Verification</a> | 
        <a href="dashboard.html">Dashboard</a>
    </div>
    <div class="card">
        <h2>Admin Panel</h2>
        <input type="text" id="usernameInput" placeholder="Kullanıcı Adı (Opsiyonel)">
        <button class="btn-add" onclick="generateKey()">Yeni Key Oluştur</button>
        
        <h3>Kayıtlı Key'ler:</h3>
        <div class="key-list" id="keyList"></div>
    </div>

    <script>
        function getKeys() {
            return JSON.parse(localStorage.getItem('validKeysData') || '[]');
        }

        function renderKeys() {
            const keys = getKeys();
            const listEl = document.getElementById('keyList');
            listEl.innerHTML = keys.length ? '' : '<span style="color:#7c7c8a">Henüz key yok.</span>';
            
            keys.forEach((k, index) => {
                const div = document.createElement('div');
                div.className = 'key-item';
                
                const userText = k.user ? `<span class="key-user">[${k.user}]</span> ` : '';
                
                div.innerHTML = `
                    <div class="key-info">
                        <div>${userText}<span>${k.key}</span></div>
                        <span class="key-date">${k.createdAt}</span>
                    </div>
                    <button class="btn-del" onclick="deleteKey(${index})">Sil</button>
                `;
                listEl.appendChild(div);
            });
        }

        function generateKey() {
            const userInput = document.getElementById('usernameInput').value.trim();
            const randomKey = 'KEY-' + Math.random().toString(36).substring(2, 8).toUpperCase() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();
            
            const now = new Date();
            const timestamp = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

            const newEntry = {
                key: randomKey,
                user: userInput !== '' ? userInput : null,
                createdAt: timestamp
            };

            const keys = getKeys();
            keys.push(newEntry);
            localStorage.setItem('validKeysData', JSON.stringify(keys));
            
            document.getElementById('usernameInput').value = '';
            renderKeys();
        }

        function deleteKey(index) {
            const keys = getKeys();
            keys.splice(index, 1);
            localStorage.setItem('validKeysData', JSON.stringify(keys));
            renderKeys();
        }

        renderKeys();
    </script>
    </body>
</html>
